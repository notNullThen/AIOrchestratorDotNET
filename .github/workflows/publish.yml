name: Publish to NuGet

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Build and pack
        run: dotnet pack AIOrchestrator/AIOrchestrator.csproj --configuration Release --output artifacts -p:PackageVersion="${GITHUB_REF_NAME#v}"

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1.1.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      - name: NuGet push
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
